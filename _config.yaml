plugins:
- jekyll-sitemap
title: うみちゃんの書き物置き場
description: ゲームや技術に関する調査記事をまとめています。
url: https://umichang.github.io
baseurl: /blog
twitter:
  card: summary
lang: ja-JP
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
defaults:
- scope:
    path: ""
    type: pages
  values:
    layout: default
    image:
      path: /image/game-planner-blog-social-card.webp
      alt: ゲームの企画、プレイヤー体験、運営、データを結ぶ設計図
# jekyll-sitemap は静的ファイルも対象にするため、検索結果へ出すページ以外を除外する。
- scope:
    path: "image"
  values:
    sitemap: false
- scope:
    path: "favicon.ico"
  values:
    sitemap: false
- scope:
    path: "favicon-32x32.png"
  values:
    sitemap: false
- scope:
    path: "apple-touch-icon.png"
  values:
    sitemap: false
- scope:
    path: "AGENTS.md"
  values:
    sitemap: false
- scope:
    path: "CLAUDE.md"
  values:
    sitemap: false
- scope:
    path: "README.md"
  values:
    sitemap: false
- scope:
    path: "LICENSE"
  values:
    sitemap: false
- scope:
    path: "rss.xml"
  values:
    sitemap: false

# 公開しても問題ない計測用の識別子だけを置く。空欄の間は計測用タグを出力しない。
analytics:
  cloudflare_web_analytics_token: "5a0cc79f486f4b9399ceff5f2b6069cb"
  google_search_console_verification: "ecP6ww2zZ67iEdObOy7jiYBqupql16ZufGUlVtsxeWY"
  bing_webmaster_verification: "9EA3B5118CB4411CF738778530A0ED9B"
  started_on: "2026-07-22"
